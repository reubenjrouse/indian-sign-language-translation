<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Times New Roman, Times, serif" fill="#111">
  <title>Figure 2: sign recognition model</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>

  <!-- ===== BiLSTM unrolled over time ===== -->
  <rect x="20" y="40" width="440" height="300" rx="12" fill="none" stroke="#7a8aa6" stroke-dasharray="5 4"/>
  <text x="32" y="60" font-size="15" font-style="italic" fill="#3b4a66">Bidirectional LSTM (2 layers, 256 units per direction)</text>

  <!-- column centres: t = 1, 2, (dots), T -->
  <!-- input vectors -->
  <g font-size="15">
    <g fill="#f6efe2" stroke="#8a6d3b">
      <rect x="92" y="352" width="36" height="34" rx="4"/>
      <rect x="182" y="352" width="36" height="34" rx="4"/>
      <rect x="362" y="352" width="36" height="34" rx="4"/>
    </g>
    <text x="110" y="374" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <text x="200" y="374" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <text x="290" y="374" text-anchor="middle">⋯</text>
    <text x="380" y="374" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">T</tspan></text>
  </g>
  <text x="240" y="410" text-anchor="middle" font-size="14">landmark features, <tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="10">108</tspan>, <tspan font-style="italic">T</tspan> = 65 frames</text>

  <!-- layer norm -->
  <rect x="70" y="300" width="350" height="26" rx="5" fill="#eceff3" stroke="#6b7280"/>
  <text x="245" y="318" text-anchor="middle" font-size="14">LayerNorm (per frame)</text>
  <g stroke="#222" stroke-width="1.2" marker-end="url(#ar)">
    <line x1="110" y1="352" x2="110" y2="328"/><line x1="200" y1="352" x2="200" y2="328"/><line x1="380" y1="352" x2="380" y2="328"/>
  </g>

  <!-- two layers of cells -->
  <g font-size="13" text-anchor="middle">
    <g fill="#dbe6f5" stroke="#3f5f99">
      <rect x="80" y="232" width="60" height="44" rx="7"/><rect x="170" y="232" width="60" height="44" rx="7"/><rect x="350" y="232" width="60" height="44" rx="7"/>
      <rect x="80" y="152" width="60" height="44" rx="7"/><rect x="170" y="152" width="60" height="44" rx="7"/><rect x="350" y="152" width="60" height="44" rx="7"/>
    </g>
    <text x="110" y="259">LSTM</text><text x="200" y="259">LSTM</text><text x="290" y="259" font-size="15">⋯</text><text x="380" y="259">LSTM</text>
    <text x="110" y="179">LSTM</text><text x="200" y="179">LSTM</text><text x="290" y="179" font-size="15">⋯</text><text x="380" y="179">LSTM</text>
  </g>
  <text x="30" y="259" font-size="12" font-style="italic" fill="#3b4a66">layer 1</text>
  <text x="30" y="179" font-size="12" font-style="italic" fill="#3b4a66">layer 2</text>

  <!-- forward (solid, right) and backward (dashed, left) recurrences -->
  <g stroke="#222" stroke-width="1.2" fill="none">
    <g marker-end="url(#ar)">
      <line x1="140" y1="244" x2="168" y2="244"/><line x1="230" y1="244" x2="268" y2="244"/><line x1="312" y1="244" x2="348" y2="244"/>
      <line x1="140" y1="164" x2="168" y2="164"/><line x1="230" y1="164" x2="268" y2="164"/><line x1="312" y1="164" x2="348" y2="164"/>
    </g>
    <g marker-end="url(#ar)" stroke-dasharray="4 3">
      <line x1="168" y1="266" x2="142" y2="266"/><line x1="268" y1="266" x2="232" y2="266"/><line x1="348" y1="266" x2="312" y2="266"/>
      <line x1="168" y1="186" x2="142" y2="186"/><line x1="268" y1="186" x2="232" y2="186"/><line x1="348" y1="186" x2="312" y2="186"/>
    </g>
    <g marker-end="url(#ar)">
      <line x1="110" y1="300" x2="110" y2="278"/><line x1="200" y1="300" x2="200" y2="278"/><line x1="380" y1="300" x2="380" y2="278"/>
      <line x1="110" y1="232" x2="110" y2="198"/><line x1="200" y1="232" x2="200" y2="198"/><line x1="380" y1="232" x2="380" y2="198"/>
      <line x1="110" y1="152" x2="110" y2="118"/><line x1="200" y1="152" x2="200" y2="118"/><line x1="380" y1="152" x2="380" y2="118"/>
    </g>
  </g>

  <!-- hidden states -->
  <g fill="#fff" stroke="#3f5f99" stroke-width="1.3">
    <circle cx="110" cy="102" r="15"/><circle cx="200" cy="102" r="15"/><circle cx="380" cy="102" r="15"/>
  </g>
  <g font-size="15" font-style="italic" text-anchor="middle">
    <text x="110" y="107">h<tspan baseline-shift="sub" font-size="10">1</tspan></text>
    <text x="200" y="107">h<tspan baseline-shift="sub" font-size="10">2</tspan></text>
    <text x="290" y="107" font-style="normal">⋯</text>
    <text x="380" y="107">h<tspan baseline-shift="sub" font-size="10">T</tspan></text>
  </g>
  <text x="240" y="80" text-anchor="middle" font-size="13"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="9" font-style="italic">t</tspan> = [ forward ; backward ] ∈ ℝ<tspan baseline-shift="super" font-size="9">512</tspan></text>

  <!-- ===== attention ===== -->
  <rect x="500" y="40" width="250" height="300" rx="12" fill="#fbf1e6" stroke="#b7793a" stroke-dasharray="5 4"/>
  <text x="512" y="60" font-size="15" font-style="italic" fill="#7a4a1a">Attention pooling</text>
  <g font-size="15">
    <text x="520" y="98"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> = <tspan font-style="italic">v</tspan><tspan baseline-shift="super" font-size="10">⊤</tspan> tanh(<tspan font-style="italic">W h</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> + <tspan font-style="italic">b</tspan>)</text>
    <text x="520" y="126"><tspan font-style="italic">α</tspan> = softmax(<tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>, …, <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">T</tspan>)</text>
    <text x="520" y="154"><tspan font-style="italic">c</tspan> = Σ<tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> <tspan font-style="italic">α</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">t</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="10">512</tspan></text>
  </g>
  <text x="520" y="178" font-size="12" fill="#555"><tspan font-style="italic">W</tspan>: 512→256,  <tspan font-style="italic">v</tspan>: 256→1</text>
  <!-- attention weights over time, a mini bar chart -->
  <line x1="530" y1="300" x2="720" y2="300" stroke="#555"/>
  <g fill="#d9a066">
    <rect x="536" y="292" width="8" height="8"/><rect x="548" y="290" width="8" height="10"/><rect x="560" y="286" width="8" height="14"/>
    <rect x="572" y="280" width="8" height="20"/><rect x="584" y="266" width="8" height="34"/><rect x="596" y="246" width="8" height="54"/>
    <rect x="608" y="226" width="8" height="74"/><rect x="620" y="238" width="8" height="62"/><rect x="632" y="260" width="8" height="40"/>
    <rect x="644" y="276" width="8" height="24"/><rect x="656" y="284" width="8" height="16"/><rect x="668" y="288" width="8" height="12"/>
    <rect x="680" y="291" width="8" height="9"/><rect x="692" y="293" width="8" height="7"/><rect x="704" y="294" width="8" height="6"/>
  </g>
  <text x="625" y="318" text-anchor="middle" font-size="12" fill="#555">frame weights <tspan font-style="italic">α</tspan><tspan baseline-shift="sub" font-size="9" font-style="italic">t</tspan>: the peak of the sign counts most</text>

  <!-- states feed the attention -->
  <path d="M395 102 H 498" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="447" y="94" text-anchor="middle" font-size="13" font-style="italic">h<tspan baseline-shift="sub" font-size="9">1…T</tspan></text>

  <!-- ===== classifier ===== -->
  <rect x="790" y="40" width="190" height="300" rx="12" fill="#eef5ec" stroke="#4f7d44" stroke-dasharray="5 4"/>
  <text x="802" y="60" font-size="15" font-style="italic" fill="#2f5527">Classifier</text>
  <g font-size="14" text-anchor="middle">
    <rect x="815" y="80" width="140" height="32" rx="5" fill="#d7ead2" stroke="#4f7d44"/><text x="885" y="101">Linear 512 → 256</text>
    <rect x="815" y="128" width="140" height="28" rx="5" fill="#fff" stroke="#4f7d44"/><text x="885" y="147">ReLU</text>
    <rect x="815" y="172" width="140" height="28" rx="5" fill="#fff" stroke="#4f7d44"/><text x="885" y="191">Dropout (<tspan font-style="italic">p</tspan> = 0.5)</text>
    <rect x="815" y="216" width="140" height="32" rx="5" fill="#d7ead2" stroke="#4f7d44"/><text x="885" y="237">Linear 256 → 60</text>
    <rect x="815" y="264" width="140" height="28" rx="5" fill="#fff" stroke="#4f7d44"/><text x="885" y="283">softmax</text>
  </g>
  <g stroke="#222" stroke-width="1.2" marker-end="url(#ar)">
    <line x1="885" y1="112" x2="885" y2="126"/><line x1="885" y1="156" x2="885" y2="170"/>
    <line x1="885" y1="200" x2="885" y2="214"/><line x1="885" y1="248" x2="885" y2="262"/>
    <line x1="885" y1="292" x2="885" y2="352"/>
  </g>
  <text x="885" y="374" text-anchor="middle" font-size="15"><tspan font-style="italic">ŷ</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="10">60</tspan></text>
  <text x="885" y="392" text-anchor="middle" font-size="12" fill="#555">probability of each sign</text>

  <!-- c feeds the classifier -->
  <path d="M700 154 H 770 V 96 H 813" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="776" y="140" font-size="14" font-style="italic">c</text>
</svg>
