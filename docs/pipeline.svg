<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" font-family="Times New Roman, Times, serif" fill="#111">
  <title>Figure 1: live translation pipeline</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1000" height="220" fill="#fff"/>

  <!-- where each part runs -->
  <rect x="100" y="30" width="570" height="140" rx="12" fill="none" stroke="#7a8aa6" stroke-dasharray="5 4"/>
  <text x="112" y="50" font-size="14" font-style="italic" fill="#3b4a66">in the browser</text>
  <rect x="690" y="30" width="170" height="140" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="702" y="50" font-size="14" font-style="italic" fill="#555">server</text>

  <!-- input -->
  <text x="48" y="104" text-anchor="middle" font-size="16">Video</text>
  <text x="48" y="122" text-anchor="middle" font-size="12" fill="#555">15 frames/s</text>

  <!-- stages -->
  <g text-anchor="middle">
    <rect x="120" y="72" width="140" height="64" rx="8" fill="#f6efe2" stroke="#8a6d3b"/>
    <text x="190" y="99" font-size="16">Landmarks</text>
    <text x="190" y="119" font-size="12" fill="#444">MediaPipe hands + pose</text>

    <rect x="320" y="72" width="140" height="64" rx="8" fill="#dbe6f5" stroke="#3f5f99"/>
    <text x="390" y="99" font-size="16">Segmentation</text>
    <text x="390" y="119" font-size="12" fill="#444">by hand height</text>

    <rect x="515" y="72" width="140" height="64" rx="8" fill="#dbe6f5" stroke="#3f5f99"/>
    <text x="585" y="99" font-size="16">Recognition</text>
    <text x="585" y="119" font-size="12" fill="#444">BiLSTM + attention</text>

    <rect x="705" y="72" width="140" height="64" rx="8" fill="#eceff3" stroke="#6b7280"/>
    <text x="775" y="99" font-size="16">Translation</text>
    <text x="775" y="119" font-size="12" fill="#444">LLM</text>
  </g>

  <!-- arrows, labelled with what flows between stages -->
  <g stroke="#222" stroke-width="1.3" marker-end="url(#ar)">
    <line x1="80" y1="104" x2="118" y2="104"/>
    <line x1="260" y1="104" x2="318" y2="104"/>
    <line x1="460" y1="104" x2="513" y2="104"/>
    <line x1="655" y1="104" x2="703" y2="104"/>
    <line x1="845" y1="104" x2="878" y2="104"/>
  </g>
  <g text-anchor="middle" font-size="13" font-style="italic">
    <text x="289" y="95">x<tspan baseline-shift="sub" font-size="9">t</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="9" font-style="normal">108</tspan></text>
    <text x="487" y="95">one sign</text>
  </g>
  <text x="480" y="200" text-anchor="middle" font-size="12.5" fill="#444">Recognised signs are sent with runner-up guesses for uncertain ones, e.g. GOOD-MORNING  WE (or THEY)  ALRIGHT.</text>

  <!-- output -->
  <text x="937" y="98" text-anchor="middle" font-size="15">“Good morning,</text>
  <text x="937" y="116" text-anchor="middle" font-size="15">we are alright.”</text>
</svg>
